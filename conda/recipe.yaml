# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: ${{ env.get("VERSION") }}

package:
  name: bokeh_sampledata
  version: ${{ version }}

source:
  - path: ${{ env.get("WHEEL_PATH") }}
  - path: ../LICENSE.txt
  - path: ../src/bokeh_sampledata/_data/geographic_boundaries.LICENSE.txt

build:
  number: 0
  string: py_0
  noarch: python
  script:
    - python -m pip install --no-deps --no-build-isolation -vv *.whl

requirements:
  host:
    - python >=3.10
    - pip
  run:
    - python >=3.10
    # Keep synchronized with [project.dependencies] in pyproject.toml.
    - icalendar
    - pandas >=1.2
    - numpy >=1.21
    - shapely >=2.0

tests:
  - python:
      imports:
        - bokeh_sampledata
        - bokeh_sampledata.us_states
        - bokeh_sampledata.us_counties
        - bokeh_sampledata.world_countries
      pip_check: true
  - script:
      - python -c "from bokeh_sampledata.us_states import data; assert len(data) == 51"
      - python -c "from bokeh_sampledata.us_counties import data; assert len(data) == 3233"
  - script:
      - python -c "from bokeh_sampledata import us_counties, world_countries; assert len(us_counties.records('TX')) == 254; assert len(world_countries.records()) == 242"

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt
    - geographic_boundaries.LICENSE.txt
  summary: Sample datasets for Bokeh examples
  homepage: https://bokeh.org
  documentation: https://docs.bokeh.org
  repository: https://github.com/bokeh/bokeh_sampledata
