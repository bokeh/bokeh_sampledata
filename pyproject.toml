[build-system]
requires = ["setuptools>=77.0.3", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "bokeh_sampledata"
dynamic = ["version"]
description = "Sample datasets for Bokeh examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "icalendar",
    "pandas >=2.2.3",
    "numpy >=1.26.4",
    "shapely >=2.0",
]
authors = [
  {email = "info@bokeh.org"},
  {name = "Bokeh Team"}
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "LICENSE-geographic-boundaries.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
homepage = "https://bokeh.org"
documentation = "https://docs.bokeh.org"
repository = "https://github.com/bokeh/bokeh_sampledata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bokeh_sampledata._data" = ["**"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}+{ccount}.g{sha}"
dirty_template = "{tag}+{ccount}.g{sha}.dirty"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]

strict = true

pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

disallow_any_unimported = true
implicit_reexport = true
namespace_packages = true
warn_return_any = false
warn_unreachable = true

# PyShp 2.x (used only for regeneration) does not ship type information.
[[tool.mypy.overrides]]
module = "shapefile"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
lint.select = ["B", "COM", "E", "F", "I", "RUF", "TID", "UP", "W"]
lint.ignore = ["COM812"]
target-version = "py310"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["pandas"]

[tool.ruff.lint.per-file-ignores]
# Keep the package initializer lightweight. Dataframe modules may import pandas.
"!src/bokeh_sampledata/__init__.py" = ["TID253"]
