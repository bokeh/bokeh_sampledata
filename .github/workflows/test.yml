name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [test-py310, test-py311, test-py312, test-py313, test-py314]
        include:
          - os: ubuntu-latest
            environment: test-py310-minimum
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
          environments: ${{ matrix.environment }}
          locked: true
      - name: Run unit tests
        run: pixi run --locked -e ${{ matrix.environment }} test-cov

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
          locked: true
      - run: pixi run --locked setup
      - name: Run repository checks
        run: pixi run --locked pre-commit run --all-files
        env:
          # This local commit guard must not reject CI runs on main.
          SKIP: no-commit-to-branch

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
          environments: build
          locked: true
      - run: pixi run --locked -e build build-py
      - run: pixi run --locked -e build build-conda
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
