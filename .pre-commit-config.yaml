default_language_version:
  python: python3.12

ci:
  autofix_prs: false

repos:
  - repo: https://github.com/netromdk/vermin
    rev: v1.6.0
    hooks:
    - id: vermin
      name: check minimum Python version
      args: ['-t=3.10-', '--violations']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: "don't commit to main branch"
        args: ['--branch', 'main']
      - id: trailing-whitespace
        exclude: ^(src/bokeh_sampledata/_data/|licenses/.*\.txt$)
      - id: end-of-file-fixer
        exclude: ^(src/bokeh_sampledata/_data/|licenses/.*\.txt$)
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
    - id: ruff-check
      args: ['--fix']
    - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked Pixi environment)
        entry: pixi run --locked typecheck-mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright (locked Pixi environment)
        entry: pixi run --locked typecheck-pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: dependencies
        name: runtime dependency consistency
        entry: pixi run --locked dependency-check
        language: system
        files: ^(pyproject\.toml|pixi\.toml|tools/check_dependencies\.py)$
        pass_filenames: false

      - id: actionlint
        name: GitHub Actions workflow checks
        entry: pixi run --locked workflow-check
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
