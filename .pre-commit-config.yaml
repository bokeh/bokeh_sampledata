default_language_version:
  python: python3.12

ci:
  autofix_prs: false

repos:
  - repo: https://github.com/netromdk/vermin
    rev: v1.6.0
    hooks:
    - id: vermin
      name: check minimum Python version
      args: ['-t=3.10-', '--violations']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        name: "don't commit to main branch"
        args: ['--branch', 'main']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: trailing-whitespace
      exclude: ^src/bokeh_sampledata/_data/
    - id: end-of-file-fixer
      exclude: ^src/bokeh_sampledata/_data/
    - id: check-json
    - id: check-toml
    - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
    - id: ruff-check
      args: ['--fix']
    - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked Pixi environment)
        entry: pixi run --locked typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: dependencies
        name: runtime dependency consistency
        entry: pixi run --locked dependency-check
        language: system
        files: ^(pyproject\.toml|pixi\.toml|conda/recipe\.yaml|tools/check_dependencies\.py)$
        pass_filenames: false
