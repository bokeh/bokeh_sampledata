default_language_version:
  python: python3.12

ci:
  autofix_prs: false

repos:
  - repo: https://github.com/netromdk/vermin
    rev: d650a487f5bfb392179d2e4a738cf550a3773fcb  # frozen: v1.9.2
    hooks:
    - id: vermin
      name: check minimum Python version
      args: ['-t=3.10-', '--violations']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: "don't commit to main branch"
        args: ['--branch', 'main']
      - id: trailing-whitespace
        exclude: ^(src/bokeh_sampledata/_data/|licenses/.*\.txt$)
      - id: end-of-file-fixer
        exclude: ^(src/bokeh_sampledata/_data/|licenses/.*\.txt$)
      - id: check-symlinks
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^src/bokeh_sampledata/_data/
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
    - id: ruff-check
      args: ['--fix']
    - id: ruff-format

  - repo: local
    hooks:
      - id: dependencies
        name: runtime dependency consistency
        entry: python tools/check_dependencies.py
        language: python
        additional_dependencies: [packaging==26.3]
        files: ^(pyproject\.toml|pixi\.toml|tools/check_dependencies\.py)$
        pass_filenames: false

      - id: actionlint
        name: GitHub Actions workflow checks
        entry: actionlint
        language: python
        additional_dependencies: [actionlint-py==1.7.12.25, shellcheck-py==0.11.0.1]
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
